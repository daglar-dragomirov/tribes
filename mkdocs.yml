site_name: TRIBES
site_description: Inference-time answer selection for optimized DSPy programs.
site_url: https://daglar-dragomirov.github.io/tribes/
repo_url: https://github.com/daglar-dragomirov/tribes
repo_name: daglar-dragomirov/tribes
edit_uri: edit/main/docs/
copyright: MIT License · Daglar Dragomirov

theme:
  name: material
  logo: assets/logo-header.png
  favicon: assets/favicon-32.png
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css?v=20

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/daglar-dragomirov/tribes
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/tribes/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            docstring_style: google
            members_order: source

nav:
  - Home: index.md
  - Guides:
      - Quick start: guides/quickstart.md
      - How it works: guides/how-it-works.md
      - Answer keys and checkers: guides/keys-and-checkers.md
      - Choosing a mode: guides/modes.md
      - FAQ: guides/faq.md
  - Results: results.md
  - API reference: api.md
  - Research record: research.md
