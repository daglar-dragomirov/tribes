[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tribes"
version = "1.2.6"
description = "Inference-time answer selection for optimized DSPy programs (GEPA, MIPROv2, SIMBA, ...)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daglar Dragomirov" }]
keywords = ["dspy", "llm", "prompt optimization", "gepa", "agents", "react", "selection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["dspy>=3.0", "litellm>=1.60"]

[project.urls]
Homepage = "https://github.com/daglar-dragomirov/tribes"
Repository = "https://github.com/daglar-dragomirov/tribes"
Issues = "https://github.com/daglar-dragomirov/tribes/issues"

[project.scripts]
tribes = "tribes.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/tribes"]

[tool.hatch.build.targets.sdist]
include = ["src/tribes", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["assets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B008", "B023", "B905", "UP035"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
